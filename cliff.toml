# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Notable changes to jilid, newest first.\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% if group is containing("Breaking") and version %}
See [Migrating](https://github.com/shuretokki/jilid/blob/{{ version }}/README.md#migrating-from-01) for how to update a document.
{% endif %}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = "^init$", replace = "feat: initial release" },
]
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 3 -->Fixes" },
  { message = ".*", skip = true },
]
